title: Meu Site Analytics
description: Site para estudar web analytics
theme: minima

# Google Analytics
google_analytics: # Vamos configurar depois

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Ferramentas e instruções internas não fazem parte do site publicado.
exclude:
  - README.md
  - AGENTS.md
  - scripts
