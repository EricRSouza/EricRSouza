name: Production approval

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: production-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  promotion:
    name: Verify DEV promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a tested DEV commit for production
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || pr.base.ref !== 'main') {
              core.info('No production promotion in this event.');
              return;
            }
            if (pr.head.ref !== 'DEV' || pr.head.repo.full_name !== context.payload.repository.full_name) {
              core.setFailed('Production only accepts a PR from DEV in this repository.');
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'site-ci.yml',
              branch: 'DEV',
              event: 'push',
              head_sha: pr.head.sha,
              per_page: 1,
            });
            if (data.workflow_runs[0]?.conclusion !== 'success') {
              core.setFailed('Wait for Site CI on this exact DEV commit to pass, then re-run this check.');
            }

  approval:
    name: Approve production
    needs: [promotion]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-approval
    steps:
      - name: Record manual release approval
        run: echo 'Eric approved this production candidate after independent agent review. No deployment is performed by this job.' >> "$GITHUB_STEP_SUMMARY"
